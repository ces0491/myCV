name: Render and Deploy Quarto
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # use-public-rspm points install.packages at Posit's prebuilt Linux
      # binaries. Without it the packages come from CRAN as source and every
      # dependency has to compile on the runner, which is how a build that
      # passed in March failed in August on fs -> sass -> bslib -> rmarkdown.
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      # setup-r-dependencies rather than a bare install.packages call, which
      # returns success even when a package fails to install. That let the
      # build go green here with rmarkdown missing and fall over two steps
      # later at the render, reporting a missing package instead of a failed
      # one. This step also caches the library between runs.
      - name: Install R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render Quarto
        run: quarto render myCV.qmd --to html

      - name: Prepare site output
        run: |
          mkdir -p _site
          cp myCV.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4